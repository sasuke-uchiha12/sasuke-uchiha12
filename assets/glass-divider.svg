<svg xmlns="http://www.w3.org/2000/svg" width="800" height="18" viewBox="0 0 800 18" role="img" aria-label="Animated gradient divider"><defs><linearGradient id="flow"><stop stop-color="#38d5e8" stop-opacity="0"/><stop offset=".3" stop-color="#38d5e8"/><stop offset=".6" stop-color="#ae80ff"/><stop offset=".8" stop-color="#ed80bd"/><stop offset="1" stop-color="#ed80bd" stop-opacity="0"/></linearGradient></defs><style>@keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}@keyframes slide{from{transform:translateX(-120px)}to{transform:translateX(920px)}}.line{animation:breathe 4s ease-in-out infinite}.spark{animation:slide 7s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}.spark{display:none}}</style><path class="line" d="M 0 9 H 800" stroke="url(#flow)"/><path class="spark" d="M -45 9 H 0" stroke="#c9f6ff" stroke-width="2" opacity=".75"/></svg>