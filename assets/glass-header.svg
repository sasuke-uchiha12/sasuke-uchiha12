<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<title id="title">Thulasi Vasan S — Machine Learning Engineer</title><desc id="desc">Animated glass panel with drifting cyan, violet and rose gradients, twinkling stars and shooting light trails.</desc>
<!-- Adapted from RyMe.md Glass Banner, copyright 2026 Ryan Polasky. MIT license: RYME-LICENSE.txt. -->
  <style>
    .g-blob1 { animation: g-drift1 12s ease-in-out infinite; }
    .g-blob2 { animation: g-drift2 12s ease-in-out infinite; }
    .g-blob3 { animation: g-drift3 12s ease-in-out infinite; }
    @keyframes g-drift1 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(40px, -25px); }
      50% { transform: translate(0, -50px); }
      75% { transform: translate(-40px, -25px); }
    }
    @keyframes g-drift2 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-30px, 25px); }
      50% { transform: translate(0, 50px); }
      75% { transform: translate(30px, 25px); }
    }
    @keyframes g-drift3 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(25px, -40px); }
      50% { transform: translate(-40px, 0); }
      75% { transform: translate(25px, 40px); }
    }
    .g-p { animation: g-pulse 3s ease-in-out infinite; }
    .p1 { animation-delay: -0.6s; }
    .p2 { animation-delay: -1.2s; }
    .p3 { animation-delay: -1.8s; }
    .p4 { animation-delay: -2.4s; }
    @keyframes g-pulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.32; }
    }
  
@keyframes starTwinkle {0%,100%{opacity:.12}50%{opacity:.85}}
.trail{stroke-width:1.3;opacity:0;animation:shoot 9s ease-out infinite}
.trail2{animation-delay:-3s;animation-duration:11s}.trail3{animation-delay:-6s;animation-duration:13s}
@keyframes shoot{0%,65%{opacity:0;transform:translate(-80px,-30px)}70%{opacity:.8}82%,100%{opacity:0;transform:translate(260px,95px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.trail{opacity:0}}
</style>
  <defs>
